# Atualizações automáticas de dependências. Cada atualização vira um PR que passa pelo CI antes de entrar.
# "cooldown": espera 7 dias depois que uma versão é publicada, para não adotar logo de cara uma versão
# que acabou de sair (é assim que pacotes comprometidos costumam ser pegos: nas primeiras horas ou dias).
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    ignore:
      # O @astrojs/check ainda só aceita TypeScript 5 e 6 (peer dependency): com o 7 o `npm ci` do site falha.
      # Tire esta regra quando uma versão dele aceitar o 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "site"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # O opentype.js 2.x não consegue ler a tabela de substituições (GSUB) da fonte do certificado
      # ("substFormat: 2 is not yet supported") e os testes de certificado quebram. Reveja quando ele a suportar.
      - dependency-name: "opentype.js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
