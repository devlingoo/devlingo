# Atualizações automáticas de dependências. Cada atualização vira um PR que passa pelo CI antes de entrar.
# "cooldown": espera 7 dias depois que uma versão é publicada, para não adotar logo de cara uma versão
# que acabou de sair (é assim que pacotes comprometidos costumam ser pegos: nas primeiras horas ou dias).
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    commit-message:
      prefix: "site"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
