name: Testar bot no Discord

# ATENÇÃO: isto liga o bot DE VERDADE, com o token do secret DISCORD_TOKEN, por até 30 minutos.
# Cada instância ligada responde a todas as mensagens. Se o bot também estiver rodando em outro
# lugar com o mesmo token (inclusive no seu computador), cada mensagem será respondida DUAS vezes.
# Para desenvolver no seu computador, use um bot de teste separado (outro token).
on:
  workflow_dispatch:

permissions:
  contents: read

# No máximo uma instância por vez aqui: disparar de novo cancela a execução anterior.
concurrency:
  group: devlingo-bot
  cancel-in-progress: true

jobs:
  run-bot:
    name: Iniciar Devlingo para testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar token do Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::O secret DISCORD_TOKEN não foi configurado. Adicione-o em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Lembrete sobre instâncias duplicadas
        run: echo "::warning title=Uma instância por token::O bot responde a todas as mensagens enquanto esta execução estiver ativa. Se ele também roda em outro lugar com o mesmo token, cada mensagem será respondida duas vezes. Para parar, cancele esta execução."

      - name: Iniciar bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: npm start
